---
# =========================================================================
# 👑 ENHANCED SECOPS VALIDATION: REVEALING TARGET METADATA IN LOGS
# =========================================================================

stages:
  - test-authfile

validate_authfile_login:
  stage: test-authfile
  tags:
    - image-builder # 🔐 Local vm-gitlabrunner-01 executor node
  variables:
    TMP_AUTH_FILE: "$CI_PROJECT_DIR/containers-auth-temp.json"
    
  script:
    - set -e # 🛡️ FAIL-FAST [1.5]
    - echo "🛡️ INITIATING OFFICIAL RED HAT SERVICE ACCOUNT AUTHENTICATION CHECK..."
    
    # 1. ATOMIC GENERATION
    - >
      if ! podman login registry.redhat.io -u "$REDHAT_USER" -p "$REDHAT_TOKEN" --authfile "$TMP_AUTH_FILE" > /dev/null 2>&1; then
        echo "🔴 CRITICAL ERROR: Failed to generate auth.json file."
        exit 1
      fi

    # 2. ATOMIC METADATA INSPECTION (Best Practice Validation)
    - echo "====================================================================="
    - echo "🔍 INSPECTING REMOTE IMAGE METADATA FROM REGISTRY.REDHAT.IO..."
    - echo "====================================================================="
    - >
      if podman run --rm --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest rpm -q rhel-release > /dev/null 2>&1; then
        echo "🟢 SECURITY VALIDATION PASSED: Secure handshake established."
        echo "---------------------------------------------------------------------"
        echo "📊 TARGET IMAGE IDENTIFIED:"
        # ➔ Affiche la version OS interne et l'architecture matérielle pour prouver que le flux fonctionne en direct
        podman run --rm --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest cat /etc/redhat-release
        podman run --rm --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest uname -m
        echo "====================================================================="
        echo "👑 MILESTONE 1 GRANTED: Handshake and live image extraction verified!"
        echo "====================================================================="
      else
        echo "🔴 SECURITY VALIDATION FAILED: Unable to fetch or inspect target image."
        exit 1
      fi

  # 🧹 SECOPS SAFETY VALVE: Guaranteed cleanup execution on the host filesystem [1.5]
  after_script:
    - echo "Executing mandatory post-job security cleanup task..."
    - rm -f "$CI_PROJECT_DIR/containers-auth-temp.json"
    - echo "Cleanup process completed. Active footprints purged from RAM. 🟢"
