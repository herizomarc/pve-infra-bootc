---
# =========================================================================
# 👑 ENTERPRISE STANDARD: SOUVEREIGN OPENBAO INTEGRATED FACTORY (SECRETLESS)
# =========================================================================

stages:
  - build-container
  - compile-disk

variables:
  # ➔ NATIVE GITLAB REGISTRY: Targets internal storage namespaces automatically
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  # Configuration globale de votre infrastructure souveraine OpenBao (VM 10.10.99.20)
  VAULT_ADDR: "https://10.10.99.20:8200"
  VAULT_SKIP_VERIFY: "true"

# ➔ STAGE 1: PARALLEL OCI CONTENERIZATION (PHASE 1)
build_bootc_container:
  stage: build-container
  image: mgmt-podman-runner:latest
  tags:
    - image-builder # Aiguillage sur votre Runner local RHEL 9 (Mode non-privilégié)
  parallel:
    matrix:
      - APPLIANCE: [zabbix]
      
  # 🔐 POIGNÉE DE MAIN INTERNE : L'agent GitLab génère le passeport OIDC cryptographique éphémère
  id_tokens:
    BAO_ID_TOKEN:
      aud: "https://10.10.99.20:8200"
      
  # 🔐 INTEGRATION NATIVE OPENBAO : Injection en RAM via les chemins descriptifs sémantiques
  secrets:
    RH_USER:
      vault: secret/data/infrastructure/rhel-registry-entitlement/service_account_username@secret
      token: $BAO_ID_TOKEN
    RH_TOKEN:
      vault: secret/data/infrastructure/rhel-registry-entitlement/service_account_token@secret
      token: $BAO_ID_TOKEN

  script:
    # Authentification transparente auprès des registres via les variables injectées en RAM
    - podman login registry.redhat.io -u "$RH_USER" -p "$RH_TOKEN"
    - podman login $CI_REGISTRY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    
    # Compilation et propulsion de l'OS immuable incluant la stack Zabbix 7.0 LTS
    - podman build -t $IMAGE_NAME/$APPLIANCE:$IMAGE_TAG -f containers/$APPLIANCE.Containerfile .
    - podman push $IMAGE_NAME/$APPLIANCE:$IMAGE_TAG

# ➔ STAGE 2: PARALLEL HARDWARE TRANSLATION (PHASE 2 - PRIVILEGED RUNNER NODE)
compile_proxmox_qcow2:
  stage: compile-disk
  image: quay.io/centos-bootc/bootc-image-builder:latest
  parallel:
    matrix:
      - APPLIANCE: [zabbix]
  tags:
    - privileged # ⚠️ MANDATORY: Requis exclusivement pour le partitionnement matériel loop-device
    
  # 🔐 RE-AUTHENTICATE : Renouvellement du passeport cryptographique pour l'étape de compilation disque
  id_tokens:
    BAO_ID_TOKEN:
      aud: "https://10.10.99.20:8200"
      
  # 🔐 EXTRACTION DES PARAMÈTRES DE SÉCURITÉ DE L'OS DE SECOURS
  secrets:
    SEC_SSH_KEY:
      vault: secret/data/infrastructure/secops-host-authentication/ed25519_public_key@secret
      token: $BAO_ID_TOKEN
    SEC_PASS_HASH:
      vault: secret/data/infrastructure/secops-console-credential/yescrypt_password_hash@secret
      token: $BAO_ID_TOKEN
      
  script:
    - podman login $CI_REGISTRY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    
    # Substitution en mémoire vive (RAM) au sein du gabarit de configuration
    - sed -i "s|{{SSH_KEY_INJECTION}}|$SEC_SSH_KEY|" config.toml
    - sed -i "s|{{PASSWORD_HASH_INJECTION}}|$SEC_PASS_HASH|" config.toml
    
    - mkdir -p build-output
    # Exécution native de la traduction disque avec isolation stricte des contextes SELinux (:z)
    - >
      podman run --rm --privileged
      -v ./config.toml:/config.toml:ro,z
      -v ./build-output:/output:z
      -v /var/lib/containers/storage:/var/lib/containers/storage:z
      quay.io/centos-bootc/bootc-image-builder:latest
      --type qcow2 --config /config.toml --output /output $IMAGE_NAME/$APPLIANCE:$IMAGE_TAG
    
    # Transfert atomique du livrable de 1,5 Go vers le datastore ISO local de votre Proxmox
    - cp ./build-output/qcow2/disk.qcow2 /var/lib/vz/template/iso/rhel9-$APPLIANCE-bootc.qcow2.img
  artifacts:
    expire_in: 2 days
    paths:
      - build-output/qcow2/*.qcow2
