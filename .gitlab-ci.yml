---
# =========================================================================
# 👑 SOUVEREIGN OPENBAO-DRIVEN ZERO-SECRET COMPILATION PIPELINE
# =========================================================================

stages:
  - build-container
  - compile-disk

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  BAO_ADDR: "https://10.10.99.20:8200"
  BAO_SKIP_VERIFY: "true"

# ➔ STAGE 1: PARALLEL OCI CONTENERIZATION (PHASE 1)
build_bootc_container:
  stage: build-container
  image: mgmt-podman-runner:latest
  tags:
    - image-builder # Aiguillage sur votre Runner local
  parallel:
    matrix:
      - APPLIANCE: [zabbix]
  script:
    # 🔐 POIGNÉE DE MAIN NATIVE VIA PODMAN CONTAINER CLIENT (Pour contourner le shell local)
    - >
      export BAO_TOKEN=$(podman run --rm -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY registry.entreprise.local/bao-client:latest sh -c "
      bao write -format=json auth/jwt/login role=gitlab-infra-role jwt=$CI_JOB_JWT | grep client_token | awk '{print \$2}' | tr -d '\",'"
      )
    
    # 🔐 EXTRACTION DES ACCÈS RED HAT EN RAM VIA LE CONTENEUR SOUVERAIN
    - >
      export RH_USER=$(podman run --rm -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY -e BAO_TOKEN=$BAO_TOKEN registry.entreprise.local/bao-client:latest bao kv get -field=service_account_username secret/infrastructure/rhel-registry-entitlement)
    - >
      export RH_TOKEN=$(podman run --rm -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY -e BAO_TOKEN=$BAO_TOKEN registry.entreprise.local/bao-client:latest bao kv get -field=service_account_token secret/infrastructure/rhel-registry-entitlement)
    
    # Authentification auprès des registres
    - podman login registry.redhat.io -u "$RH_USER" -p "$RH_TOKEN"
    - podman login $CI_REGISTRY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    
    # Compilation OCI
    - podman build -t $IMAGE_NAME/$APPLIANCE:$IMAGE_TAG -f containers/$APPLIANCE.Containerfile .
    - podman push $IMAGE_NAME/$APPLIANCE:$IMAGE_TAG

# ➔ STAGE 2: PARALLEL HARDWARE TRANSLATION (PHASE 2)
compile_proxmox_qcow2:
  stage: compile-disk
  image: quay.io/centos-bootc/bootc-image-builder:latest
  parallel:
    matrix:
      - APPLIANCE: [zabbix]
  tags:
    - privileged
  script:
    - podman login $CI_REGISTRY -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    
    # Ré-authentification via le conteneur client pour l'étape de build matériel
    - >
      export BAO_TOKEN=$(podman run --rm -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY registry.entreprise.local/bao-client:latest sh -c "
      bao write -format=json auth/jwt/login role=gitlab-infra-role jwt=$CI_JOB_JWT | grep client_token | awk '{print \$2}' | tr -d '\",'"
      )
    
    - >
      export SEC_SSH_KEY=$(podman run --rm -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY -e BAO_TOKEN=$BAO_TOKEN registry.entreprise.local/bao-client:latest bao kv get -field=ed25519_public_key secret/infrastructure/secops-host-authentication)
    - >
      export SEC_PASS_HASH=$(podman run --rm -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY -e BAO_TOKEN=$BAO_TOKEN registry.entreprise.local/bao-client:latest bao kv get -field=yescrypt_password_hash secret/infrastructure/secops-console-credential)
    
    - sed -i "s|{{SSH_KEY_INJECTION}}|$SEC_SSH_KEY|" config.toml
    - sed -i "s|{{PASSWORD_HASH_INJECTION}}|$SEC_PASS_HASH|" config.toml
    
    - mkdir -p build-output
    - >
      podman run --rm --privileged
      -v ./config.toml:/config.toml:ro,z
      -v ./build-output:/output:z
      -v /var/lib/containers/storage:/var/lib/containers/storage:z
      quay.io/centos-bootc/bootc-image-builder:latest
      --type qcow2 --config /config.toml --output /output $IMAGE_NAME/$APPLIANCE:$IMAGE_TAG
    
    - cp ./build-output/qcow2/disk.qcow2 /var/lib/vz/template/iso/rhel9-$APPLIANCE-bootc.qcow2.img
  artifacts:
    expire_in: 2 days
    paths:
      - build-output/qcow2/*.qcow2
