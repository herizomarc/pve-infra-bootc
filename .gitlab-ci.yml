---
# =========================================================================
# 🔬 STEP 3.4: LIVE OPENBAO SSOT RAM EXTRACTION AND AUDIT FLOW
# =========================================================================

stages:
  - test-ssot

extract_bao_secrets:
  stage: test-ssot
  tags:
    - image-builder # 🔐 Anchored on your local vm-gitlabrunner-01 executor node
  variables:
    BAO_ADDR: "https://10.10.99.20:8200"
    BAO_SKIP_VERIFY: "true"
    
  # 🔐 MATCHING AUDIENCE: Must align with your OpenBao 'bound_audiences'
  id_tokens:
    SECURE_OIDC_TOKEN:
      aud: "https://gitlab.com"
      
  script:
    - set -e # 🛡️ FAIL-FAST [1.5]
    - echo "🛡️ INITIATING LIVE SOUVEREIGN SECRETS EXTRACTION..."
    
    # 1. ATOMIC HANDSHAKE
    - >
      export BAO_TOKEN=$(podman run --rm --network=host alpine:latest sh -c "
        apk add --no-cache curl jq > /dev/null && \
        curl -s -k --request POST --data '{\"role\": \"gitlab-infra-role\", \"jwt\": \"$SECURE_OIDC_TOKEN\"}' $BAO_ADDR/v1/auth/jwt/login | jq -r '.auth.client_token'
      ")

    # 2. ATOMIC RAM EXTRACTION (No disk footprint, pure memory mapping) [1.5, 1.11]
    - echo "Querying OpenBao engine endpoints for RHEL entitlements..."
    - >
      export VAULT_RESPONSE=$(podman run --rm --network=host alpine:latest sh -c "
        apk add --no-cache curl jq > /dev/null && \
        curl -s -k -H \"X-Vault-Token: $BAO_TOKEN\" $BAO_ADDR/v1/secret/data/infrastructure/rhel-registry-entitlement
      ")

    # 3. SECOPS AUDIT CONTROLS: Parse inside RAM without echoing sensitive strings [1.5]
    - export EXTRACTED_USER=$(echo "$VAULT_RESPONSE" | podman run --rm -i alpine:latest sh -c "apk add --no-cache jq > /dev/null && jq -r '.data.data.service_account_username'")
    - export EXTRACTED_TOKEN=$(echo "$VAULT_RESPONSE" | podman run --rm -i alpine:latest sh -c "apk add --no-cache jq > /dev/null && jq -r '.data.data.service_account_token'")

    # 4. CONDITIONAL BLOCK IF: Asserting data validity string lengths
    - >
      if [ -n "$EXTRACTED_USER" ] && [ -n "$EXTRACTED_TOKEN" ]; then
        echo "🟢 SSOT VALIDATION PASSED: Secrets successfully mapped inside volatile RAM maps!"
        echo "---------------------------------------------------------------------"
        echo "📊 AUDIT FOOTPRINT TRACKING:"
        # Displays safely the masked structure signature to prove it works [1.5]
        echo "Service Account Target -> ${EXTRACTED_USER:0:7}******"
        echo "Token Size Verified    -> $(echo -n '$EXTRACTED_TOKEN' | wc -c) bytes"
        echo "====================================================================="
        echo "👑 MILESTONE 3.4 GRANTED: Single Source of Truth is fully operational!"
        echo "====================================================================="
      else
        echo "🔴 SSOT VALIDATION FAILED: OpenBao returned empty payload values."
        exit 1
      fi
