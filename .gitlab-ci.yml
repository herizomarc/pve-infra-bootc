---
# =========================================================================
# 👑 STEP 1.5: NETWORK-HARDENED LIVE METADATA EXTRACTION TEST
# =========================================================================

stages:
  - test-authfile

validate_authfile_login:
  stage: test-authfile
  tags:
    - image-builder # 🔐 Local vm-gitlabrunner-01 executor node
  variables:
    TMP_AUTH_FILE: "$CI_PROJECT_DIR/containers-auth-temp.json"
    
  script:
    - set -e # 🛡️ FAIL-FAST
    - echo "🛡️ INITIATING OFFICIAL RED HAT SERVICE ACCOUNT AUTHENTICATION CHECK..."
    
    # 1. ATOMIC GENERATION
    - >
      if ! podman login registry.redhat.io -u "$REDHAT_USER" -p "$REDHAT_TOKEN" --authfile "$TMP_AUTH_FILE" > /dev/null 2>&1; then
        echo "🔴 CRITICAL ERROR: Failed to generate auth.json file."
        exit 1
      fi

    # 2. ISOLATED NETWORK PULL: Forcer le téléchargement explicite avec affichage de la progression
    - echo "====================================================================="
    - echo "📥 PULLING BASE IMAGE LAYERS FROM REGISTRY.REDHAT.IO..."
    - echo "====================================================================="
    - podman pull --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest

    # 3. ATOMIC METADATA INSPECTION (Using network host mapping to leverage AdGuard resolution)
    - echo "====================================================================="
    - echo "🔍 INSPECTING LOCAL METADATA EXTRACTIONS..."
    - echo "====================================================================="
    - >
      if podman run --rm --network=host --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest cat /etc/redhat-release > /dev/null 2>&1; then
        echo "🟢 SECURITY VALIDATION PASSED: Secure handshake and download established."
        echo "---------------------------------------------------------------------"
        echo "📊 TARGET IMAGE IDENTIFIED:"
        # Exécution en réseau local partagé
        podman run --rm --network=host --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest cat /etc/redhat-release
        podman run --rm --network=host --authfile "$TMP_AUTH_FILE" registry.redhat.io/rhel9/rhel-bootc:latest uname -m
        echo "====================================================================="
        echo "👑 MILESTONE 1 GRANTED: Handshake and live image extraction verified!"
        echo "====================================================================="
      else
        echo "🔴 SECURITY VALIDATION FAILED: Unable to execute commands inside target image."
        exit 1
      fi

  # 🧹 SECOPS SAFETY VALVE: Guaranteed cleanup execution on the host filesystem
  after_script:
    - echo "Executing mandatory post-job security cleanup task..."
    - rm -f "$CI_PROJECT_DIR/containers-auth-temp.json"
    - echo "Cleanup process completed. Active footprints purged from RAM. 🟢"
