---
# =========================================================================
# 👑 STEP 2.5: SYSTEMLESS IMMUTABLE QCOW2 GENERATION WITH SMART WAIT-LOOP
# =========================================================================

stages:
  - generate-disk

variables:
  # ➔ LOCKED CRYPTOGRAPHIC DIGEST SIGNATURE FROM YOUR REGISTER
  TARGET_CONTAINER_IMAGE: "://gitlab.com"
  BUILDER_TOOL: "quay.io/centos-bootc/bootc-image-builder:latest"
  TARGET_DISK: "$CI_PROJECT_DIR/output/qcow2/disk.qcow2"

test_disk_compilation:
  stage: generate-disk
  tags:
    - image-builder # 🔐 Anchored on your local vm-gitlabrunner-01 executor node
  script:
    - set -e # 🛡️ FAIL-FAST [1.5]
    - echo "⚙️ INITIATING APPLIANCE DISK TRANSLATION MATRIX..."
    
    # 1. CLEANING AND PREPARING WORKSPACE BOUNDARIES
    - rm -rf $CI_PROJECT_DIR/output
    - mkdir -p $CI_PROJECT_DIR/output
    
    # 2. RUNNING THE NATIVE COMPILER WITH SYSTEMLESS ISOLATION [source: 2, 2.21]
    # Mounts raw image layers storage paths directly to bypass systemd sockets dependencies [2.21]
    - echo "📥 Launching background disk translation utilizing raw containers storage mounts..."
    - >
      podman run --rm --privileged --ipc=host \
        -v /var/lib/containers/storage:/var/lib/containers/storage \
        -v $CI_PROJECT_DIR/output:/output \
        $BUILDER_TOOL \
        --type qcow2 \
        --local \
        $TARGET_CONTAINER_IMAGE &
        
    # 3. 🧠 THE SMART WAIT-LOOP: Intelligent polling and size stabilization mapping [1.5]
    - echo "⏳ Entering Smart Wait-Loop. Polling filesystem for disk.qcow2 availability..."
    - |
      TIMEOUT_COUNTER=0
      PREVIOUS_SIZE=-1
      
      while [ $TIMEOUT_COUNTER -lt 40 ]; do
        if [ -f "$TARGET_DISK" ]; then
          CURRENT_SIZE=$(stat -c%s "$TARGET_DISK" 2>/dev/null || echo 0)
          echo "📊 [Polling Cycle $TIMEOUT_COUNTER] File detected. Current allocation: $((CURRENT_SIZE / 1024 / 1024)) MB"
          
          if [ $CURRENT_SIZE -gt 0 ] && [ $CURRENT_SIZE -eq $PREVIOUS_SIZE ]; then
            echo "🟢 STABILIZATION DETECTED: File size is locked. Compilation process is over."
            break
          fi
          PREVIOUS_SIZE=$CURRENT_SIZE
        else
          echo "💤 [Polling Cycle $TIMEOUT_COUNTER] Waiting for bootc-image-builder to mount partition maps..."
        fi
        
        sleep 15
        TIMEOUT_COUNTER=$((TIMEOUT_COUNTER + 1))
      done
      
      if [ $TIMEOUT_COUNTER -eq 40 ]; then
        echo "🔴 TIMEOUT ERROR: Disk packaging took too long or failed silently."
        exit 1
      fi

    # 4. FINAL VERIFICATION OF THE ARTIFACT
    - echo "🔍 Executing final filesystem integrity checks..."
    - ls -lh $CI_PROJECT_DIR/output/qcow2/
    - >
      if [ -f "$TARGET_DISK" ]; then
        echo "====================================================================="
        echo "👑 MILESTONE 2.5 GRANTED: Sovereign stabilized QCOW2 image is ready!"
        echo "====================================================================="
      else
        echo "🔴 VALIDATION FAULT: Stabilized disk array could not be located."
        exit 1
      fi

  artifacts:
    name: "sovereign-zabbix-appliance-disk"
    expire_in: 1 day
    paths:
      - output/qcow2/disk.qcow2
