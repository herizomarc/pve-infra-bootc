---
# =========================================================================
# 👑 STEP 3.5: NATIVE OPENBAO CLI RAM EXTRACTION (THE PROFESSIONAL WAY)
# =========================================================================

stages:
  - test-ssot

extract_bao_secrets:
  stage: test-ssot
  tags:
    - image-builder # 🔐 Anchored on your local vm-gitlabrunner-01 node
  variables:
    BAO_ADDR: "https://10.10.99.20:8200"
    BAO_SKIP_VERIFY: "true"
    TMP_AUTH_FILE: "$CI_PROJECT_DIR/containers-auth-temp.json"
    # ➔ Utilisation de l'image de conteneur officielle du projet OpenBao
    BAO_CLIENT: "quay.io/openbao/openbao:latest"
    
  id_tokens:
    SECURE_OIDC_TOKEN:
      aud: "https://gitlab.com"
      
  script:
    - set -e # 🛡️ FAIL-FAST [1.5]
    - echo "🛡️ INITIATING LIVE SOUVEREIGN SECRETS EXTRACTION VIA NATIVE CLI..."
    
    # 1. NATIVE HANDSHAKE: Échange du jeton via le binaire officiel en 1 seule ligne propre [1.11]
    - >
      export BAO_TOKEN=$(podman run --rm --network=host -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY $BAO_CLIENT sh -c "
        bao write -format=json auth/jwt/login role=gitlab-infra-role jwt=$SECURE_OIDC_TOKEN | grep client_token | awk '{print \$2}' | tr -d '\",'
      ")

    # 2. NATIVE FIELD EXTRACTIONS: Plus besoin de cURL ni de jQ ! Extraction directe par champ en RAM [1.11]
    - echo "Streaming RHEL entitlements straight from OpenBao fields into RAM..."
    - >
      export EXTRACTED_USER=$(podman run --rm --network=host -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY -e BAO_TOKEN=$BAO_TOKEN $BAO_CLIENT \
        bao kv get -field=service_account_username secret/infrastructure/rhel-registry-entitlement)
    - >
      export EXTRACTED_TOKEN=$(podman run --rm --network=host -e BAO_ADDR=$BAO_ADDR -e BAO_SKIP_VERIFY=$BAO_SKIP_VERIFY -e BAO_TOKEN=$BAO_TOKEN $BAO_CLIENT \
        bao kv get -field=service_account_token secret/infrastructure/rhel-registry-entitlement)

    # 3. CONDITIONAL SAFETY EXITS [1.5]
    - >
      if [ -z "$EXTRACTED_USER" ] || [ "$EXTRACTED_USER" = "null" ]; then
        echo "🔴 SSOT CRITICAL FAULT: Extracted user via CLI is null or empty. Flow terminated."
        exit 1
      fi

    - echo "🟢 SSOT VALIDATION PASSED Real secrets mapped inside volatile RAM maps!"
    - echo "---------------------------------------------------------------------"
    - echo "Service Account Target -> ${EXTRACTED_USER:0:7}******"
    - echo "====================================================================="
    
    # 4. ATOMIC AUTHFILE PASS-THROUGH TESTING [1.5, 2.21]
    - echo "Testing passport login generation against registry.redhat.io..."
    - >
      if ! podman login registry.redhat.io -u "$EXTRACTED_USER" -p "$EXTRACTED_TOKEN" --authfile "$TMP_AUTH_FILE" > /dev/null 2>&1; then
        echo "🔴 REGISTRY FAULT: Generated authfile was rejected by Red Hat authentication gates."
        exit 1
      fi
      
    - echo "👑 MILESTONE 3.5 GRANTED Single Source of Truth architecture is live and fully verified!"

  # 🧹 SECOPS SAFETY VALVE: Garantie absolue de destruction [1.5]
  after_script:
    - echo "Executing mandatory post-job security cleanup task..."
    - rm -f "$CI_PROJECT_DIR/containers-auth-temp.json"
    - echo "Cleanup process completed. Active footprints purged from RAM. 🟢"
