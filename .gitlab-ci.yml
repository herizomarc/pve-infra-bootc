---
# =========================================================================
# 🔬 STEP 3.1: ISOLATED OPENBAO OIDC JWT HANDSHAKE VALIDATION
# =========================================================================

stages:
  - test-handshake

validate_bao_handshake:
  stage: test-handshake
  tags:
    - image-builder # 🔐 Anchored on your local vm-gitlabrunner-01 executor node
  variables:
    BAO_ADDR: "https://10.10.99.20:8200"
    BAO_SKIP_VERIFY: "true"
    
  script:
    - set -e # 🛡️ FAIL-FAST: Stop immediately upon any error [1.5]
    - echo "🛡️ INITIATING OFFICIAL SOUVEREIGN OPENBAO OIDC HANDSHAKE TEST..."
    - echo "Target Authority Endpoint -> $BAO_ADDR"
    
    # 1. ATOMIC IF BLOCK: Execute the handshake and verify token generation instantly
    - echo "Sending ephemeral GitLab JWT to OpenBao login gate..."
    - >
      if ! export INITIAL_BAO_TOKEN=$(podman run --rm --network=host alpine:latest sh -c "
        apk add --no-cache curl jq > /dev/null && \
        curl -s -k --request POST --data '{\"role\": \"gitlab-infra-role\", \"jwt\": \"$CI_JOB_JWT\"}' $BAO_ADDR/v1/auth/jwt/login | jq -r '.auth.client_token'
      "); then
        echo "🔴 HANDSHAKE CRITICAL ERROR: Network connection to OpenBao failed or refused."
        exit 1
      fi

    # 2. ATOMIC CONDITIONAL CHECK: Validate the format of the intercepted token
    # (A valid OpenBao client token always begins with the 'btoken.' prefix)
    - >
      if echo "$INITIAL_BAO_TOKEN" | grep -q "^btoken\."; then
        echo "🟢 HANDSHAKE VALIDATION PASSED: Secure dynamic token successfully intercepted in RAM!"
        echo "====================================================================="
        echo "👑 HANDSHAKE GRANTED: OpenBao strictly trusts GitLab Cloud identity!"
        echo "====================================================================="
      else
        echo "🔴 HANDSHAKE VALIDATION FAILED: Received an invalid or null token string."
        echo "Diagnostic Data -> OpenBao rejected the token. Check gitlab-infra-role configuration or logs."
        exit 1
      fi
