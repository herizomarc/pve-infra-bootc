---
# =========================================================================
# 👑 THE GOLD STANDARD: ATOMIC CONDITIONAL VALIDATION WITH GUARANTEED PURGE
# =========================================================================

stages:
  - test-authfile

validate_authfile_login:
  stage: test-authfile
  tags:
    - image-builder # 🔐 Anchored on your local vm-gitlabrunner-01 executor node
  variables:
    # Centralized path definition for the transient RAM passport file
    TMP_AUTH_FILE: "$CI_PROJECT_DIR/containers-auth-temp.json"
    
  script:
    - set -e # 🛡️ FAIL-FAST: Forces immediate job termination upon any system error [1.5]
    - echo "🛡️ INITIATING OFFICIAL RED HAT SERVICE ACCOUNT AUTHENTICATION CHECK..."
    
    # 1. ATOMIC IF BLOCK: Instantly generates and validates file write success [1.5]
    - echo "Generating ephemeral token passport into $TMP_AUTH_FILE..."
    - >
      if ! podman login registry.redhat.io -u "$REDHAT_USER" -p "$REDHAT_TOKEN" --authfile "$TMP_AUTH_FILE" > /dev/null 2>&1; then
        echo "🔴 CRITICAL ERROR: Failed to generate auth.json file. Double check your GitLab UI variables."
        exit 1
      fi

    # 2. ATOMIC IF BLOCK: Validates passport authenticity against the official catalog [1.5]
    - echo "Verifying passport validity against registry.redhat.io endpoint..."
    - >
      if podman image search registry.redhat.io/rhel9/rhel-bootc --authfile "$TMP_AUTH_FILE" --limit 1 > /dev/null 2>&1; then
        echo "🟢 SECURITY VALIDATION PASSED: Secure handshake established with the Red Hat Catalog."
        echo "====================================================================="
        echo "👑 MILESTONE 1 GRANTED: Ephemeral --authfile pipeline authentication is 100% OK."
        echo "====================================================================="
      else
        echo "🔴 SECURITY VALIDATION FAILED: Generated auth.json is either corrupt or expired."
        exit 1
      fi

  # 🧹 SECOPS SAFETY VALVE: Guaranteed cleanup execution on the host filesystem
  # This block runs MANDATORILY, even if the script steps above crash violently [1.5].
  after_script:
    - echo "Executing mandatory post-job security cleanup task..."
    - rm -f "$CI_PROJECT_DIR/containers-auth-temp.json"
    - echo "Cleanup process completed. Active footprints purged from RAM. 🟢"
