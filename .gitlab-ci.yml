---
# =========================================================================
# 🔬 ISOLATED TEST: STAGE 2 ONLY (RED HAT OFFICIAL QCOW2 PACKAGING)
# =========================================================================

stages:
  - package

variables:
  # ➔ Ciblage temporaire de votre image d'hier pour le test rapide
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/zabbix-bootc"
  IMAGE_TAG: "3065db3c"
  BUILDER_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

build_disk_image:
  stage: package
  tags:
    - image-builder
  script:
    - |
      set -euxo pipefail
      
      # 1. Préparation idempotente du répertoire de sortie
      sudo rm -rf "$CI_PROJECT_DIR/output"
      mkdir -p "$CI_PROJECT_DIR/output"
      
      # 2. Connexion et Pull explicite en mode rootful (Standard Red Hat)
      sudo podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      sudo podman pull "$IMAGE_NAME:$IMAGE_TAG"
      
      # 3. Conversion directe en QCOW2
      sudo podman run --rm --privileged \
        -v /var/lib/containers/storage:/var/lib/containers/storage \
        -v "$CI_PROJECT_DIR/output:/output" \
        "$BUILDER_IMAGE" \
        --type qcow2 \
        "$IMAGE_NAME:$IMAGE_TAG"
        
      # 4. Vérification du livrable local
      ls -lh "$CI_PROJECT_DIR/output/qcow2/disk.qcow2"
      echo "🟢 DISK GENERATION VALIDATED!"
  after_script:
    - sudo podman logout "$CI_REGISTRY" || true
