---
# =========================================================================
# 👑 PRODUCTION STAGE 2.5: CRYPTOGRAPHICALLY LOCKED DISK TRANSLATION
# =========================================================================

stages:
  - generate-disk

variables:
  BUILDER_TOOL: "quay.io/centos-bootc/bootc-image-builder:latest"
  TARGET_DISK: "$CI_PROJECT_DIR/output/qcow2/disk.qcow2"

generate_qcow2_disk:
  stage: generate-disk
  tags:
    - image-builder # 🔐 Anchored on your local vm-gitlabrunner-01 executor node
  variables:
    # ➔ 👑 ABSOLUTE SECOPS ANCHOR: Pointing directly to your verified image layer
    LOCAL_TARGET_IMAGE: "gitlab.com"
  script:
    - set -e # 🛡️ FAIL-FAST [1.5]
    - echo "⚙️ INITIATING APPLIANCE DISK TRANSLATION FOR LOCKED TARGET -> ${LOCAL_TARGET_IMAGE}"
    
    # 1. CLEANING AND PREPARING WORKSPACE WITH ELEVATED PRIVILEGES
    - sudo rm -rf $CI_PROJECT_DIR/output
    - mkdir -p $CI_PROJECT_DIR/output
    
    # 2. THE CACHE BRIDGE TRICK: Serializing the exact sha256 layer map into rootful storage [2.21]
    - echo "🔄 Syncing user image layer maps into local rootful storage structures..."
    - podman save ${LOCAL_TARGET_IMAGE} | sudo podman load
    - podman save ${BUILDER_TOOL} | sudo podman load
    
    # 3. NATIVE SYNCHRONOUS COMPILATION [1.10, source: 2, 2.21]
    - echo "📥 Launching synchronous rootful disk translation utilizing local storage layers..."
    - >
      sudo podman run --rm --privileged --ipc=host \
        -v /var/lib/containers/storage:/var/lib/containers/storage \
        -v $CI_PROJECT_DIR/output:/output \
        ${BUILDER_TOOL} \
        --type qcow2 \
        --local \
        ${LOCAL_TARGET_IMAGE}

    # 4. FINAL INTEGRITY CHECKS
    - echo "🔍 Executing final filesystem integrity checks..."
    - ls -lh $CI_PROJECT_DIR/output/qcow2/
    - >
      if [ -f "$TARGET_DISK" ]; then
        echo "====================================================================="
        echo "👑 MILESTONE 2.5 GRANTED: Sovereign stabilized QCOW2 image is ready!"
        echo "====================================================================="
      else
        echo "🔴 VALIDATION FAULT: Compiled disk.qcow2 file could not be located."
        exit 1
      fi
